# _brand.yml · Estación R (proyecto: shiny_eph_panel)
# Sincronizado con el spec visual oficial:
#   https://github.com/Estacion-R/estacion-r-branding/blob/main/_brand.yml
#
# Paleta oficial de marca (NO la del curso).

color:
  palette:
    white:     "#FFFFFF"
    black:     "#151515"
    blue:      "#447099"
    orange:    "#EE6331"
    green:     "#72994E"
    teal:      "#419599"
    burgundy:  "#9A4665"
    secondary: "#707073"
    tertiary:  "#C2C2C4"
    dark:      "#404041"
    amarillo:  "#EAFF38"   # acento web (sombras), no color oficial

  foreground: black
  background: white
  primary:    blue
  secondary:  secondary
  tertiary:   tertiary
  success:    green
  info:       teal
  warning:    orange
  danger:     burgundy
  light:      white
  dark:       dark

typography:
  fonts:
    - family: Ubuntu
      source: google
      weight: [300, 400, 500, 700]

  base:     Ubuntu
  headings: Ubuntu

  monospace-block:
    color: "#447099"

logo:
  small:  www/logos/isotipo_estacion_r.svg
  medium: www/logos/logo_completo_estacion_r.svg